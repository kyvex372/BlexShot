name: Publish release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run ID
        type: string
        required: true
      tag:
        description: Version tag
        type: string
        default: v1.4.1
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify build and download executable
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:BUILD_RUN_ID -notmatch '^\d+$') { throw 'Invalid build run ID' }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid version tag' }
          $run = gh run view $env:BUILD_RUN_ID --repo $env:GITHUB_REPOSITORY --json conclusion,workflowName,headSha | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read build run' }
          if ($run.conclusion -ne 'success' -or $run.workflowName -ne 'Windows') { throw 'A successful Windows build is required' }
          gh run download $env:BUILD_RUN_ID --repo $env:GITHUB_REPOSITORY --name BlexShot-windows-x64 --dir release-files
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $report = Get-Content -LiteralPath release-files/artifacts/exe-verification.json -Raw | ConvertFrom-Json
          $hash = (Get-FileHash -LiteralPath release-files/dist/BlexShot.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($report.exit_code -ne 0 -or -not $report.x64_gui -or $hash -ne $report.sha256) { throw 'Executable verification mismatch' }
          "$hash  BlexShot.exe" | Set-Content -LiteralPath release-files/SHA256SUMS.txt -Encoding ascii
          "BUILD_SHA=$($run.headSha)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG release-files/dist/BlexShot.exe release-files/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:BUILD_SHA --title "BlexShot $env:RELEASE_TAG" --notes-file docs/RELEASES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
